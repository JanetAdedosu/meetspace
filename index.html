
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetSpace | Video Meetings</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <h1 class="logo">MeetSpace</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">About</a>
        </nav>

        <button class="login-btn">Log In</button>
    </header>

    <main class="hero">

        <section class="hero-content">
            <h2>Connect. Collaborate. Create.</h2>

            <p>
                Bring people together with simple,
                reliable video meetings.
            </p>

            <div class="meeting-actions">
                <button id="createMeetingBtn">
                    New Meeting
                </button>

                <div class="join-meeting">
                    <input
                        type="text"
                        id="meetingCode"
                        placeholder="Enter meeting code"
                    >

                    <button id="joinMeetingBtn">
                        Join Meeting
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 MeetSpace. All rights reserved.</p>
    </footer>

    <!-- Connect our JavaScript file -->
    <script src="script.js" defer></script>

</body>
</html>
